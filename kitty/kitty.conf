# ============================================================================
# Kitty Terminal Configuration
# Based on Alacritty config with Kanagawa Wave theme
# ============================================================================

# ----------------------------------------------------------------------------
# Fonts
# ----------------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font Medium
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 14.0

# Disable ligatures when cursor is on them
disable_ligatures cursor

# ----------------------------------------------------------------------------
# Cursor
# ----------------------------------------------------------------------------
cursor #c8c093
cursor_text_color #1f1f28
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ----------------------------------------------------------------------------
# Scrollback
# ----------------------------------------------------------------------------
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 3.0

# ----------------------------------------------------------------------------
# Mouse
# ----------------------------------------------------------------------------
mouse_hide_wait 3.0
url_color #7e9cd8
url_style curly
open_url_with default
detect_urls yes
copy_on_select no

# Click URLs to open them
mouse_map left click ungrabbed mouse_handle_click selection link prompt

# ----------------------------------------------------------------------------
# Window Layout
# ----------------------------------------------------------------------------
# Start maximized (on macOS use macos_launch_cmd to achieve this effect)
remember_window_size  yes
initial_window_width  1920
initial_window_height 1080

# Window padding
window_padding_width 0

# Hide window decorations
hide_window_decorations titlebar-only
# On macOS, use 'titlebar-only' to hide titlebar but keep native tabs
# Or use 'yes' to hide all decorations completely

# macOS specific: start maximized
macos_launch_cmd yes

# Window borders
window_border_width 0pt
window_margin_width 0

# ----------------------------------------------------------------------------
# Tab Bar
# ----------------------------------------------------------------------------
tab_bar_edge bottom
tab_bar_style powerline
tab_bar_min_tabs 2
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# ----------------------------------------------------------------------------
# Color Scheme - Kanagawa Wave
# ----------------------------------------------------------------------------

# Basic colors
foreground #dcd7ba
background #1f1f28

# Cursor colors
cursor #c8c093
cursor_text_color #1f1f28

# Selection colors
selection_foreground #c8c093
selection_background #2d4f67

# URL colors (when hovering)
url_color #7e9cd8

# Tab bar colors
active_tab_foreground   #1f1f28
active_tab_background   #7e9cd8
inactive_tab_foreground #c8c093
inactive_tab_background #363646

# Color table

# Black
color0 #090618
color8 #727169

# Red
color1 #c34043
color9 #e82424

# Green
color2 #76946a
color10 #98bb6c

# Yellow
color3 #c0a36e
color11 #e6c384

# Blue
color4 #7e9cd8
color12 #7fb4ca

# Magenta
color5 #957fb8
color13 #938aa9

# Cyan
color6 #6a9589
color14 #7aa89f

# White
color7 #c8c093
color15 #dcd7ba

# ----------------------------------------------------------------------------
# Bell
# ----------------------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.3
visual_bell_color #44df44
window_alert_on_bell yes

# ----------------------------------------------------------------------------
# Performance Tuning
# ----------------------------------------------------------------------------
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ----------------------------------------------------------------------------
# Shell Integration
# ----------------------------------------------------------------------------
shell /bin/zsh --login -c "tmux attach || tmux"
shell_integration enabled

# ----------------------------------------------------------------------------
# macOS Specific Settings
# ----------------------------------------------------------------------------
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in all
macos_thicken_font 0.15

# ----------------------------------------------------------------------------
# Keyboard Shortcuts
# ----------------------------------------------------------------------------

# Use Cmd as modifier on macOS
kitty_mod cmd

# Clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Font sizes
map cmd+equal change_font_size all +2.0
map cmd+plus change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+0 change_font_size all 0

# New window/tab
map cmd+n new_os_window
map cmd+t new_tab
map cmd+w close_window

# Window navigation
map cmd+] next_window
map cmd+[ previous_window

# Tab navigation
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

# Reload config
map cmd+ctrl+, load_config_file

# Scrolling
map cmd+k scroll_line_up
map cmd+j scroll_line_down
map cmd+page_up scroll_page_up
map cmd+page_down scroll_page_down
map cmd+home scroll_home
map cmd+end scroll_end

# Layout management
map cmd+enter new_window
map cmd+shift+enter new_window_with_cwd
map cmd+alt+enter new_window_with_layout

# Select and act on visible text
map cmd+e open_url_with_hints
map cmd+p>f kitten hints --type path --program -
map cmd+p>shift+f kitten hints --type path
map cmd+p>l kitten hints --type line --program -
map cmd+p>w kitten hints --type word --program -
map cmd+p>h kitten hints --type hash --program -

# Miscellaneous
map cmd+equal change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+backspace change_font_size all 0

# ----------------------------------------------------------------------------
# Advanced Features
# ----------------------------------------------------------------------------

# Allow remote control (useful for scripting)
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# Confirm before closing windows with running programs
confirm_os_window_close 1

# Update check
update_check_interval 0

# ----------------------------------------------------------------------------
# Layout Configuration
# ----------------------------------------------------------------------------
enabled_layouts splits,stack,tall,grid

# ----------------------------------------------------------------------------
# Advanced Color Options (Optional)
# ----------------------------------------------------------------------------
# Background opacity (uncomment to enable transparency)
# background_opacity 0.95
# background_blur 32
# dynamic_background_opacity yes

# Dim unfocused windows
# dim_opacity 0.75
