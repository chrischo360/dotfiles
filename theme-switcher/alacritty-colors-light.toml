# Kanagawa Lotus colors (Light theme)
[colors.primary]
background = '#f2ecbc'
foreground = '#545464'

[colors.cursor]
text = '#f2ecbc'
cursor = '#43436c'

# Normal colors
[colors.normal]
black   = '#43436c'
red     = '#c84053'
green   = '#6f894e'
yellow  = '#77713f'
blue    = '#4d699b'
magenta = '#b35b79'
cyan    = '#597b75'
white   = '#545464'

# Bright colors
[colors.bright]
black   = '#8a8980'
red     = '#d7474b'
green   = '#6e915f'
yellow  = '#836f4a'
blue    = '#6693bf'
magenta = '#624c83'
cyan    = '#5e857a'
white   = '#43436c'

# Selection colors
[colors.selection]
text = '#43436c'
background = '#c9cbd1'

# Search colors
[colors.search.matches]
foreground = '#f2ecbc'
background = '#8a8980'

[colors.search.focused_match]
foreground = '#f2ecbc'
background = '#6e915f'

# Footer bar colors
[colors.footer_bar]
foreground = '#f2ecbc'
background = '#8a8980'

# Hints
[colors.hints.start]
foreground = '#f2ecbc'
