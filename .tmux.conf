# Set prefix to Ctrl+Space
unbind C-b  # Unbind the default prefix (Ctrl+B)
set -g prefix C-Space  # Set Ctrl+Space as the new prefix
bind C-Space send-prefix  # Allow sending Ctrl+Space to applications

# Bind Ctrl-B + S to show a list of all sessions
bind s choose-tree -s

# Reload config with Prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Enable mouse support (scrolling, resizing panes, etc.)
set -g mouse on

# Enable Vim-Like Bindings
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback history limit
set -g history-limit 10000

# Status bar customization
set -g status-left-length 50
set -g status-left "[#S]"
set -g status-bg black
set -g status-fg yellow
set -g status-right-length 150

set -g status-interval 2  # Refresh the status bar every 2 seconds
set -g status-right "#[fg=lightgreen] %I:%M %p #[fg=lightgreen] | %a, %b %d"

# Split pane shortcuts (use Prefix + | or -)
bind | split-window -h
bind - split-window -v

# Split panes using | and -
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Create new windows in the same directory
bind c new-window -c "#{pane_current_path}"

# Set fish as default shell
# set -g default-shell /opt/homebrew/bin/fish

# Plugins (requires Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect settings
set -g @resurrect-save 'C-f'
set -g @resurrect-restore 'C-r'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# restoring nvim sessions
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'
