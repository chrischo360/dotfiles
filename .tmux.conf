# Set new prefix
unbind C-b
set -g prefix C-Space

bind C-Space send-prefix  # Allow sending Ctrl+Space to applications

# Bind Ctrl-B + S to show a list of all sessions
# bind s choose-tree -sZ -O name
# Unbind s
unbind s

# Interactive session switcher with fzf (Prefix + Ctrl-j)
bind s display-popup -E "tmux list-sessions -F '#{?session_attached,,#{session_name}}' | sed '/^$/d' | fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}' | xargs tmux switch-client -t"

# Reload config with Prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Enable mouse support (scrolling, resizing panes, etc.)
set -g mouse on

# Enable Vim-Like Bindings
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + hjkl (Vim-like)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback history limit
set -g history-limit 10000

# Style (your existing theme)
set -g status-style bg=#393F51,fg=#f0f0f0

# Status Left: Session Name | Claude Status
set -g status-left-length 80
set -g status-left "[#S] | #(~/.config/tmux/scripts/claude_status.sh)"

# Status Right: Time | Date
set -g status-right-length 150
# set -g status-right "#[fg=lightgreen] %I:%M %p #[fg=lightgreen] | %a, %b %d"
# set -g status-right "#[fg=lightgreen] %I:%M %p #[fg=lightgreen] | %a, %b %d"

set -g status-right '#{cpu_percentage} | #{ram_percentage} | %a %h-%d %H:%M '
# Refresh interval
set -g status-interval 2

# Modus Vivendi Tinted pane border colors
set-option -g pane-active-border-style fg=#79a8ff
set-option -g pane-border-style fg=#393F51

# Modus Vivendi Tinted window status formatting
set-option -g window-status-format ' #I:#W '
set-option -g window-status-current-format '#[bg=#79a8ff,fg=#1d2235] #I:#W#{?window_zoomed_flag,  , }'

# Split pane shortcuts (use Prefix + | or -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Split panes using | and -
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Create new windows in the same directory
bind c new-window -c "#{pane_current_path}"

# Plugins (requires Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'tmux-plugins/tmux-mem'
set -g @plugin 'tmux-plugins/tmux-cpu'

# tmux-resurrect settings
set -g @resurrect-save 'C-f'
set -g @resurrect-restore 'C-r'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# restoring nvim sessions
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'
