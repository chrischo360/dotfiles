# Dotfiles mise configuration
# Strategy: mise for LANGUAGE RUNTIMES, Homebrew for CLI TOOLS
#
# Why this split?
# - mise: Version management, per-project switching (.nvmrc, .python-version)
# - Homebrew: Pre-built binaries, faster install, stable releases, no API limits

# ============================================
# Language Runtimes
# ============================================
# These enable per-project version switching

[tools]
node = "lts"                    # Node.js (replaces fnm)
python = "latest"               # Python (replaces pyenv)
ruby = "latest"                 # Ruby (replaces rbenv)
java = "latest"                 # Java JDK
bun = "latest"                  # Fast JavaScript runtime
deno = "latest"                 # Secure TypeScript runtime

# ============================================
# Build Tools & Package Managers
# ============================================
# Tools that benefit from version management

yarn = "latest"                 # JavaScript package manager
maven = "latest"                # Java build tool
sbt = "latest"                  # Scala build tool
scala = "latest"                # Scala language
kubectl = "latest"              # Kubernetes CLI

# NOTE: gradle and pipx → Brewfile.macos (GitHub API rate limits in mise)

# NOTE: All CLI tools (jq, fzf, ripgrep, eza, bat, etc.) → Brewfile.macos
# NOTE: GUI apps, fonts, macOS-specific tools → Brewfile.macos

# ============================================
# Environment Configuration
# ============================================

[env]
# Add mise shims and local bin to PATH
_.path = [
    "$HOME/.local/share/mise/shims",
    "$HOME/.local/bin",
    "$HOME/dotfiles/claude/scripts",
]

# Set default editor
EDITOR = "nvim"
VISUAL = "nvim"

# Python configuration
PYTHON_CONFIGURE_OPTS = "--enable-shared"

# Node configuration
NODE_OPTIONS = "--max-old-space-size=4096"

[settings]
# Use legacy version files (.node-version, .python-version, etc.)
legacy_version_file = true

# Auto-install tools when entering directory with .tool-versions
auto_install = true

# Shorter plugin names
shorthands_file = "~/.config/mise/shorthands.toml"

# Use all CPU cores for compilation
jobs = 4
