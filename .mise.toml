# Dotfiles mise configuration - Cross-platform base config
# Platform-specific tools are in .mise.macos.toml and .mise.linux.toml

# ============================================
# Language Runtimes (Cross-Platform)
# ============================================
# These enable per-project version switching

[tools]
# Core language runtimes
node = "lts"                    # Node.js (replaces fnm)
python = "latest"               # Python (replaces pyenv)
ruby = "latest"                 # Ruby (replaces rbenv)
java = "latest"                 # Java (macOS: sdkman takes precedence via zshrc; Linux: mise manages it directly)
bun = "latest"                  # Fast JavaScript runtime
deno = "latest"                 # Secure TypeScript runtime

# ============================================
# Build Tools & Package Managers (Cross-Platform)
# ============================================
# Tools that benefit from version management

yarn = "latest"                 # Yarn package manager
kubectl = "latest"

# Java ecosystem (Java now via sdkman, but keep maven/sbt/scala in mise)
maven = "latest"                # Java build tool
sbt = "latest"                  # Scala build tool
scala = "latest"                # Scala language (uses Java from sdkman)
coursier = "latest"             # Scala dependency manager and tool installer

# ============================================
# CLI Tools (Shell Enhancements)
# ============================================
# Note: aqua backend works with AQUA_GITHUB_TOKEN set in ~/dotfiles/.env
zoxide = "latest"               # Smarter cd command
eza = "latest"                  # Modern ls replacement
bat = "latest"                  # Cat with syntax highlighting
fd = "latest"                   # Modern find
ripgrep = "latest"              # Fast text search (rg)
fzf = "latest"                  # Fuzzy finder
yt-dlp = "latest"               # YouTube downloader/streamer

# ============================================
# Terminal & Editors
# ============================================
tmux = "latest"                 # Terminal multiplexer
neovim = "latest"               # Editor (aqua backend, cross-platform)

# ============================================
# Version Control
# ============================================
# git → system/Homebrew (building via mise is heavy; system git is fine)
gh = "latest"                   # GitHub CLI (aqua:cli/cli, cross-platform)
delta = "latest"                # Git diff pager (aqua:dandavison/delta, cross-platform)

# ============================================
# Development Tools
# ============================================
jq = "latest"                   # JSON processor
tree-sitter = "latest"          # Parser generator (required by nvim-treesitter main branch)
"vfox:mise-plugins/vfox-gradle" = "latest"  # Gradle (vfox backend avoids GitHub API)
"asdf:mise-plugins/mise-pipx" = "latest"    # pipx (asdf backend avoids GitHub API)
mkcert = "latest"               # Local SSL certificates
direnv = "latest"               # Environment variable manager
just = "latest"                 # Modern make alternative

# ============================================
# npm Global Packages
# ============================================
"npm:@google/gemini-cli" = "latest"    # Gemini AI CLI (settings: ~/dotfiles/gemini/)
"npm:@biomejs/biome" = "latest"        # JavaScript/TypeScript formatter and linter
"npm:ccstatusline" = "latest"          # Claude Code statusline
"npm:prettier" = "latest"              # Code formatter
"npm:prettier-plugin-svelte" = "latest"  # Svelte support for prettier
"npm:@mariozechner/pi-coding-agent" = "latest"  # Pi coding agent

# NOTE: macOS-specific CLI tools (terminal-notifier, rsync, curl, swiftlint) → Brewfile.macos
# NOTE: GUI apps and fonts → Brewfile.macos

# ============================================
# Environment Configuration
# ============================================

[env]
# Claude scripts PATH (mise shims are automatically added via mise activate)
_.path = [
    "~/dotfiles/claude/scripts",
]

# Set default editor
EDITOR = "nvim"
VISUAL = "nvim"

# Python configuration
PYTHON_CONFIGURE_OPTS = "--enable-shared"

# Node configuration
NODE_OPTIONS = "--max-old-space-size=4096"

[settings]
# Use legacy version files (.node-version, .python-version, etc.)
legacy_version_file = true

# Auto-install tools when entering directory with .tool-versions
auto_install = true

# Enable idiomatic version files (.nvmrc, .python-version, .ruby-version, etc.)
idiomatic_version_file_enable_tools = ["node", "python", "ruby"]

# Shorter plugin names
# shorthands_file = "~/.config/mise/shorthands.toml"

# Use all CPU cores for compilation
jobs = 4

# Enable experimental features (required for hooks)
experimental = true

# Disable GitHub Artifact Attestations verification (aqua + github backends).
# The attestation API check is fragile across mise versions and auth states
# (e.g. fails to decode the response, blocking `gh`). SHA256 checksum
# verification still runs, so download integrity is preserved.
aqua.github_attestations = false
github.github_attestations = false

# No hooks needed for standard mise usage
