[window]

padding.x = 0
padding.y = 0

# opacity = 0.85
# decorations = "buttonless"
decorations = "none"

startup_mode = "Maximized"

[font]

normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size=14

# Kanagawa Wave colors
[colors.primary]
background = '#1f1f28'
foreground = '#dcd7ba'

[colors.cursor]
text = '#1f1f28'
cursor = '#c8c093'

# Normal colors
[colors.normal]
black   = '#090618'
red     = '#c34043'
green   = '#76946a'
yellow  = '#c0a36e'
blue    = '#7e9cd8'
magenta = '#957fb8'
cyan    = '#6a9589'
white   = '#c8c093'

# Bright colors
[colors.bright]
black   = '#727169'
red     = '#e82424'
green   = '#98bb6c'
yellow  = '#e6c384'
blue    = '#7fb4ca'
magenta = '#938aa9'
cyan    = '#7aa89f'
white   = '#dcd7ba'

# Selection colors
[colors.selection]
text = '#c8c093'
background = '#2d4f67'

# Search colors
[colors.search.matches]
foreground = '#1f1f28'
background = '#c0a36e'

[colors.search.focused_match]
foreground = '#1f1f28'
background = '#e6c384'

# Footer bar colors
[colors.footer_bar]
foreground = '#1f1f28'
background = '#727169'

# Hints
[colors.hints.start]
foreground = '#1f1f28'
background = '#e6c384'

[colors.hints.end]
foreground = '#1f1f28'
background = '#727169'

# Line indicator
[colors.line_indicator]
foreground = 'None'
background = 'None'

# VI mode
[colors.vi_mode_cursor]
text = '#1f1f28'
cursor = '#7e9cd8'

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "tmux attach || tmux"]

# Additional enhancements for better transparency experience
[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[scrolling]
history = 10000
multiplier = 3

[mouse]
hide_when_typing = true

# Key bindings for better UX
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Plus"
mods = "Command"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Command"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Command"
action = "ResetFontSize"

# Bell configuration for notifications
[bell]
animation = "EaseOutExpo"
duration = 300
color = "#44df44"  # Green flash for visual notification
