[general]
import = [
  "~/.config/alacritty/themes/themes/catppuccin_latte.toml"
]
live_config_reload = true

[window]

padding.x = 0
padding.y = 0

# opacity = 0.85
# decorations = "buttonless"
decorations = "none"

startup_mode = "Maximized"

[font]

# normal = { family = "FiraCode Nerd Font", style = "Regular" }
# normal = { family = "Hack Nerd Font", style = "Medium" }

# normal = { family = "Monaspace Neon", style = "Regular" }
# normal = { family = "Cascadia Code", style = "Regular" }
# normal = { family = "Iosevka Nerd Font", style = "Regular" }
normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size=13.25

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "tmux attach || tmux"]

# Additional enhancements for better transparency experience
[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[scrolling]
history = 10000
multiplier = 3

[mouse]
hide_when_typing = true

# Key bindings for better UX
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Plus"
mods = "Command"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Command"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Command"
action = "ResetFontSize"

# Bell configuration for notifications
[bell]
animation = "EaseOutExpo"
duration = 300
color = "#44df44"  # Green flash for visual notification
