[window]

padding.x = 10
padding.y = 10

opacity = 0.85
decorations = "transparent"

startup_mode = "Maximized"

[font]

normal = { family = "JetBrainsMono Nerd Font", style = "Medium" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size=15

# Modus Vivendi Tinted colors (softer than default)
[colors.primary]
background = '#0d0e1c'
foreground = '#ffffff'

[colors.cursor]
text = '#0d0e1c'
cursor = '#ffffff'

# Normal colors
[colors.normal]
black   = '#0d0e1c'
red     = '#ff5f59'
green   = '#44bc44'
yellow  = '#d0bc00'
blue    = '#2fafff'
magenta = '#feacd0'
cyan    = '#00d3d0'
white   = '#ffffff'

# Bright colors
[colors.bright]
black   = '#1d2235'
red     = '#ff5f5f'
green   = '#44df44'
yellow  = '#efef00'
blue    = '#338fff'
magenta = '#ff66ff'
cyan    = '#00eff0'
white   = '#989898'

# Selection colors
[colors.selection]
text = '#0d0e1c'
background = '#ffffff'

# Search colors
[colors.search.matches]
foreground = '#0d0e1c'
background = '#989898'

[colors.search.focused_match]
foreground = '#0d0e1c'
background = '#44df44'

# Footer bar colors
[colors.footer_bar]
foreground = '#0d0e1c'
background = '#989898'

# Hints
[colors.hints.start]
foreground = '#0d0e1c'
background = '#efef00'

[colors.hints.end]
foreground = '#0d0e1c'
background = '#989898'

# Line indicator
[colors.line_indicator]
foreground = 'None'
background = 'None'

# VI mode
[colors.vi_mode_cursor]
text = '#0d0e1c'
cursor = '#2fafff'

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/bin/zsh"
args = ["-l", "-c", "tmux attach || tmux"]

# Additional enhancements for better transparency experience
[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[scrolling]
history = 10000
multiplier = 3

[mouse]
hide_when_typing = true

# Key bindings for better UX
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Plus"
mods = "Command"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Command"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Command"
action = "ResetFontSize"

# Bell configuration for notifications
[bell]
animation = "EaseOutExpo"
duration = 300
color = "#44df44"  # Green flash for visual notification
