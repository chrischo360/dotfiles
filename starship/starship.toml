# Command duration - shows how long the last command took
[cmd_duration]
min_time = 500
format = "took [$duration](bold yellow) "

# Git status - show detailed git repository status
# DISABLED: This slows down prompt rendering
[git_status]
disabled = true
conflicted = "🏳"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
up_to_date = "✓"
untracked = "?"
stashed = "\\$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# Git metrics - show lines added/deleted
# DISABLED: This is expensive and slows down prompt rendering
[git_metrics]
disabled = true
added_style = "bold green"
deleted_style = "bold red"
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

# Disable username display
[username]
disabled = true

