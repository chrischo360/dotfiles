# Set new prefix
unbind C-b
set -g prefix C-Space

bind C-Space send-prefix  # Allow sending Ctrl+Space to applications

# Bind Ctrl-B + S to show a list of all sessions
# bind s choose-tree -sZ -O name
# Unbind s
unbind s

# Interactive session switcher with fzf (Prefix + s)
bind s display-popup -E "tmux list-sessions -F '#{?session_attached,,#{session_name}}' | sed '/^$/d' | fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}' | xargs tmux switch-client -t"

# Quick session toggle (Prefix + Space) - switches to last session
unbind Enter
bind Enter switch-client -l

# Quick window toggle (Prefix + Enter) - switches to last window
bind Space last-window

# Quick pane toggle (Prefix + Tab) - switches to last pane
bind Tab last-pane

# Move pane layout cycling to Prefix + n (was on Space by default)
bind n next-layout

# Reload config with Prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Reload zsh in idle panes only with Prefix + R (Shift+r) - skips vim, ssh, etc.
bind R run-shell "~/.config/tmux/scripts/reload-zsh-safe.sh"

# Enable mouse support (scrolling, resizing panes, etc.)
set -g mouse on

# Enable focus events (required for FocusGained/FocusLost in Neovim)
set -g focus-events on

# Terminal and UTF-8 Configuration for Unicode Support
# Required for proper rendering of box-drawing characters in TUIs
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # Undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # Underscore colors
set -as terminal-overrides ',xterm-kitty:Cs=\E]12;%p1%s\a:Cr=\E]112\a' # Cursor color passthrough

# Enable Vim-Like Bindings
setw -g mode-keys vi

# Visual selection modes
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi Escape send -X clear-selection

# Copy/yank (stay in copy mode after yanking)
bind-key -T copy-mode-vi y send -X copy-selection
bind-key -T copy-mode-vi Y send -X copy-end-of-line

# Search (vim-like)
bind-key -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""
bind-key -T copy-mode-vi n send -X search-again
bind-key -T copy-mode-vi N send -X search-reverse

# Navigation (vim-like)
bind-key -T copy-mode-vi g send -X history-top
bind-key -T copy-mode-vi G send -X history-bottom
bind-key -T copy-mode-vi H send -X top-line
bind-key -T copy-mode-vi M send -X middle-line
bind-key -T copy-mode-vi L send -X bottom-line

# Jump to beginning/end of line
bind-key -T copy-mode-vi 0 send -X start-of-line
bind-key -T copy-mode-vi ^ send -X back-to-indentation
bind-key -T copy-mode-vi $ send -X end-of-line

# Enable clipboard integration with macOS
set -g set-clipboard on
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + hjkl (Vim-like)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback history limit
set -g history-limit 50000

# Minimal theme - inherit colors from Alacritty
# This allows Alacritty to be the source of truth for theming
set -g status-style bg=default,fg=default

# Status Left: Session Name
set -g status-left-length 80
set -g status-left "[#S]"

# Status Right: Claude Status | CPU | RAM | Time | Date
set -g status-right-length 150
set -g status-right '#(~/.config/tmux/scripts/claude_status.sh) | #{cpu_percentage} | #{ram_percentage} | %a %h-%d %H:%M '

# Refresh interval
set -g status-interval 2

# Minimal pane styling - use terminal defaults
set-option -g pane-active-border-style fg=green
set-option -g pane-border-style fg=default,bg=default
set -g pane-border-lines heavy

# Pane title indicators
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=black bg=green]   #P: [#{session_name}] #{pane_current_command}   ,#[fg=brightblack]  #P }"

# Use default colors for windows (inherits from Alacritty)
set-option -g window-style fg=default,bg=default
set-option -g window-active-style fg=default,bg=default

# Display pane numbers with simple colors
set-option -g display-panes-time 1000
set-option -g display-panes-active-colour green
set-option -g display-panes-colour brightblack

# Minimal window status formatting
set-option -g window-status-format ' #I:#W '
set-option -g window-status-current-format ' #I:#W#{?window_zoomed_flag,  , } '
set-option -g window-status-current-style reverse

# Split pane shortcuts (use Prefix + | or -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Split panes using | and -
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Create new windows in the same directory
bind c new-window -c "#{pane_current_path}"

# Plugins (requires Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'tmux-plugins/tmux-cpu'
# set -g @plugin 'tmux-plugins/tmux-mem'
set -g @plugin 'tmux-plugins/tmux-cpu'

# tmux-resurrect settings
set -g @resurrect-save 'C-f'
set -g @resurrect-restore 'C-r'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# restoring nvim sessions
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'
